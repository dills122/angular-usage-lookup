name: Draft skill release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a version-matched tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("skill/angular-usage-lookup/package.json", "utf8")).version')
          test "$RELEASE_TAG" = "v$VERSION"
  quality:
    needs: tag
    uses: ./.github/workflows/quality.yml
  draft:
    needs: [tag, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skill-bundle
          path: dist
      - name: Verify the tested bundle
        run: cd dist && sha256sum --check --strict ./*.zip.sha256
      - name: Create draft with tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/*.manifest.json \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md
